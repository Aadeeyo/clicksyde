# Clicksyde on Netlify: `node build.mjs` writes the site (plus a page per article, case study and service) to dist/.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pages on the current clicksyde.com, sent to their new homes so search rankings carry over
[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/services"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/work"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/start#talk"
  status = 301

[[redirects]]
  from = "/contact/*"
  to = "/start#talk"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
